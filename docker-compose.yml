services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obias
      # No hardcoded default: a committed default password on a datastore
      # is a real credential the moment this compose file is ever used
      # somewhere reachable, not just on localhost. Set POSTGRES_PASSWORD in
      # a local, gitignored .env next to this file (docker compose reads it
      # automatically) before running `docker compose up`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a local .env file}
      POSTGRES_DB: obias
    ports:
      # Bound to loopback only — this is a local dev datastore, not meant to
      # be reachable from the network.
      - "127.0.0.1:55432:5432"
    volumes:
      - obias_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in a local .env file}"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  obias_postgres_data:
