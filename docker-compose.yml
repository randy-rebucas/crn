services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obias
      POSTGRES_PASSWORD: obias_dev_password
      POSTGRES_DB: obias
    ports:
      - "55432:5432"
    volumes:
      - obias_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  obias_postgres_data:
